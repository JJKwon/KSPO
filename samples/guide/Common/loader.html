<style>
@font-face {
    font-family: 'D2Coding';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_three@1.0/D2Coding.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}
.guideBox {margin-top:40px;}
.guideTitle {font-size:18px; font-weight:500;}
.guideCont {margin-top:10px;}
.gGroup {margin-top:20px;}
.gText {font-size:14px;}
.gView {padding:10px; border:1px solid #bbbbbb; background:#fff;}
</style>

<div class="cptPubGuide">
<div class="guideArea">

<!-- 가이드 그룹 -->
<div class="guideBox">
<div class="guideTitle">Loader</div>
<div class="guideCont">
<div class="gText">
    - 페이지 전체가 로딩 중일 때 dim 뒤에 표시되는 전면 로더입니다. 버튼을 누르면 확인할 수 있습니다.
    실제 화면에서는 버튼 클릭이 아니라 <code>Loader.show()</code> / <code>Loader.hide()</code> 를 코드에서 직접 호출해서 켜고 끕니다.
    * dim은 별도 디자인이 없어 .comModal과 동일한 방식으로 임의 제작함 (추후 실제 dim 디자인으로 교체 예정)
</div>
<div class="gGroup">
<div class="gView"></div>
<div class="gCode">
<pre><code class="xml" style="font-size:14px; letter-spacing:1.5px; font-family: 'D2Coding'"></code></pre>
<textarea class="codeGuide" style="display:none;">

<!-- 로더 여는 버튼 (데모용. 실제로는 버튼이 아니라 로딩 시작·종료 시점에 Loader.show()/Loader.hide()를 코드에서 직접 호출)
     data-loader-auto-hide 는 가이드 데모에서 실제 로딩이 끝나는 상황을 흉내내기 위한 것으로, 실제 사용시에는 넣지 않아도 된다 -->
<button class="btn primary large" type="button" data-loader-open="pageLoaderSample" data-loader-auto-hide="2000">로더 보기 (2초 후 자동으로 닫힘)</button>

<!-- 페이지 로더 -->
<div class="comLoader" id="pageLoaderSample">
    <div class="loaderDim"></div>
    <div class="loaderDots">
        <span class="loaderDot"></span>
        <span class="loaderDot"></span>
        <span class="loaderDot"></span>
        <span class="loaderDot"></span>
    </div>
</div>

</textarea>
</div>
</div>
</div>
</div>
<!-- //가이드 그룹 -->


</div>
</div>


<script>
    run();
</script>
