<style>
@font-face {
    font-family: 'D2Coding';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_three@1.0/D2Coding.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}
.guideBox {margin-top:40px;}
.guideTitle {font-size:18px; font-weight:500;}
.guideCont {margin-top:10px;}
.gGroup {margin-top:20px;}
.gText {font-size:14px;}
.gView {padding:10px; border:1px solid #bbbbbb; background:#fff;}
</style>

<div class="cptPubGuide">
<div class="guideArea">

<!-- 가이드 그룹 -->
<div class="guideBox">
<div class="guideTitle">Button</div>
<div class="guideCont">
<div class="gText">
    - 사용자 액션을 실행하는 버튼입니다. (Primary/Secondary/Tertiary 3가지 타입, Large/Medium/Small 3가지 사이즈, Hover는 CSS :hover로 자동 처리, Disabled는 disabled 속성으로 처리)
</div>
<div class="gGroup">
<div class="gView"></div>
<div class="gCode">
<pre><code class="xml" style="font-size:14px; letter-spacing:1.5px; font-family: 'D2Coding'"></code></pre>
<textarea class="codeGuide" style="display:none;">

<!-- 버튼 : Type = Primary, Size = Large/Medium/Small -->
<button class="btn primary large" type="button">버튼</button>
<button class="btn primary medium" type="button">버튼</button>
<button class="btn primary small" type="button">버튼</button>

<br>

<!-- 버튼 : Type = Secondary, Size = Large/Medium/Small -->
<button class="btn secondary large" type="button">버튼</button>
<button class="btn secondary medium" type="button">버튼</button>
<button class="btn secondary small" type="button">버튼</button>

<br>

<!-- 버튼 : Type = Tertiary, Size = Large/Medium/Small -->
<button class="btn tertiary large" type="button">버튼</button>
<button class="btn tertiary medium" type="button">버튼</button>
<button class="btn tertiary small" type="button">버튼</button>

<br>

<!-- 버튼 : State = Disabled (타입 공통, disabled 속성으로 처리) -->
<button class="btn primary large" type="button" disabled>버튼</button>
<button class="btn secondary large" type="button" disabled>버튼</button>
<button class="btn tertiary large" type="button" disabled>버튼</button>

<br>

<!-- 버튼 : 왼쪽 아이콘만 (span.ico 포함 여부로 조합) -->
<button class="btn primary large" type="button">
    <span class="ico -download"></span>
    버튼
</button>

<!-- 버튼 : 오른쪽 아이콘만 -->
<button class="btn primary large" type="button">
    버튼
    <span class="ico -newWindow"></span>
</button>

<!-- 버튼 : 양쪽 아이콘 -->
<button class="btn primary large" type="button">
    <span class="ico -download"></span>
    버튼
    <span class="ico -newWindow"></span>
</button>

<br>

<!-- 버튼 그룹 : 가운데 정렬 (Tertiary + Secondary + Primary 순, .btn을 gap 12px로 나열) -->
<div style="display:flex; gap:12px; justify-content:center;">
    <button class="btn tertiary large" type="button">버튼</button>
    <button class="btn secondary large" type="button">버튼</button>
    <button class="btn primary large" type="button">버튼</button>
</div>

<br>

<!-- 버튼 그룹 : 양쪽 배치 (좌측 Tertiary+Secondary / 우측 Primary) -->
<div style="display:flex; gap:12px; justify-content:space-between;">
    <div style="display:flex; gap:12px;">
        <button class="btn tertiary large" type="button">버튼</button>
        <button class="btn secondary large" type="button">버튼</button>
    </div>
    <button class="btn primary large" type="button">버튼</button>
</div>

</textarea>
</div>
</div>
</div>
</div>
<!-- //가이드 그룹 -->


</div>
</div>


<script>
    run();
</script>
