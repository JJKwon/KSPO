<div class="gText">
    - 버튼을 누르면 툴팁이 열립니다. 다른 곳을 클릭하거나 닫기 버튼을 누르면 닫힙니다. (bottom/top 방향, left/center/right 화살표 정렬 조합)

<div class="comTooltip -bottom -center">
    <button class="btn tertiary medium" type="button" data-tooltip-trigger>도움말</button>
    <div class="tooltipPanel">
        <span class="tooltipArrow"><img src="../../images/common/ico_tooltip_arrow.svg" alt=""></span>
        <div class="tooltipCon">
            <p class="tooltipText">툴팁은 150자 내외의 텍스트만 제공되어야 합니다. 내부에 닫기 버튼을 포함한 대화형 요소를 사용하지 않습니다.</p>

</div>
